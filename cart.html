<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPHA CLOTHING - Cart</title>
    
    <link rel="stylesheet" href="main.css"> <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Cart Page के लिए कुछ बुनियादी CSS (आप इसे main.css में भी डाल सकते हैं) */
        .cart-container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
        }
        .item-details {
            display: flex;
            align-items: center;
        }
        .item-details img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            margin-right: 20px;
            border-radius: 4px;
        }
        .item-name h4 {
            margin: 0 0 5px 0;
            font-size: 1.1em;
        }
        .item-name p {
            margin: 0;
            color: #555;
        }
        .item-price, .item-quantity {
            font-weight: bold;
        }
        .remove-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s;
            
        }
        .remove-btn:hover {
            background-color: #e60000;
            transform: translateY(-3px) scale(1.05);
        }
        .cart-summary {
            text-align: right;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #333;
        }
        .cart-summary h3 {
            font-size: 1.5em;
            margin-bottom: 20px;
        }
        .place-order-btn {
            background-color: #1E2939;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2em;
            cursor: pointer;
            border-radius: 4px;
             transition: transform 0.25s ease;
              box-shadow:   #1e2939e1 0px 2px 4px -1px;
        }
        .place-order-btn:hover {
            background-color: #1e2939e8;
            transform: translateY(-3px) scale(1.05);
        }

          #home-btn {
            background-color: #ffffff;
            color: rgb(0, 0, 0);
            border: none;
            padding: 12px 25px;
            font-size: 1.1em;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 5px;
            
            box-shadow: 0 0 25px 3px rgba(0, 0, 0, 0.096);
            text-decoration: none; /* Link style */
            display: inline-block;
            transition: transform 0.25s, background-color 0.3s, color 0.3s;
        }
        #home-btn:hover {
            background-color: #000000;
            color: #ffffff;
            transform: translateY(-3px) scale(1.05);
        }
        @media (max-width: 600px) {
            .cart-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .item-details {
                margin-bottom: 10px;
            }
            .cart-summary {
                text-align: left;
            }
        }
    </style>
</head>
<body>
  
    <div class="cart-container">
        <h2>🛍️ Your Shopping Cart</h2>
        <div id="cart-items-list">
            <p id="empty-cart-message">Your cart is empty.</p>
        </div>

        <div class="cart-summary">
            <h3>Total: ₹<span id="cart-total">0.00</span></h3>
            <button class="place-order-btn" onclick="placeOrder()">Place Order</button>
             <a href="index.html"> <button id="home-btn" type="button">Home</button></a>
             
        </div>
    </div>

    <section id="contact">
        </section>

    <script src="script.js"></script>
  <script>
    // Page load hote hi cart dikhane ke liye
    document.addEventListener('DOMContentLoaded', displayCart);

    function displayCart() {
        const cart = JSON.parse(localStorage.getItem("cart")) || [];
        const cartContainer = document.getElementById("cart-items-list");
        const totalElement = document.getElementById("cart-total");

        if (cart.length === 0) {
            cartContainer.innerHTML = '<p id="empty-cart-message">Your cart is empty.</p>';
            totalElement.innerText = "0.00";
            return;
        }

        cartContainer.innerHTML = ""; 
        let total = 0;

        cart.forEach((item, index) => {
            let price = parseFloat(item.price) || 0;
            let qty = parseInt(item.quantity) || 1;
            let itemTotal = price * qty;
            total += itemTotal;

            let div = document.createElement("div");
            div.classList.add("cart-item");
            div.innerHTML = `
                <div class="item-details">
                    <img src="${item.image || 'https://via.placeholder.com/80'}" alt="${item.name}">
                    <div class="item-name">
                        <h4>${item.name}</h4>
                        <p>Price: ₹${price.toFixed(2)}</p>
                    </div>
                </div>
                <div class="item-price">₹${itemTotal.toFixed(2)}</div>
                <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
            `;
            cartContainer.appendChild(div);
        });

        totalElement.innerText = total.toFixed(2);
    }

    // --- YE RHA MISSING FUNCTION ---
    function placeOrder() {
        const cart = JSON.parse(localStorage.getItem("cart")) || [];
        
        if (cart.length === 0) {
            alert("Bhai, cart toh khali hai! Kuch add toh kar lo.");
            return;
        }

        // Cart ka sara data 'directOrder' mein save karna taki payment page padh sake
        localStorage.setItem("directOrder", JSON.stringify(cart));
        
        // Payment page par bhejna (Bina mode=direct ke, taki cart clear ho jaye baad mein)
        window.location.href = 'payment.html';
    }

    function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        cart.splice(index, 1);
        localStorage.setItem("cart", JSON.stringify(cart));
        displayCart(); // List refresh karna
    }
</script>
</body>
</html>
