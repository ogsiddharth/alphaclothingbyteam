<!DOCTYPE html>
<html>
<head><title>Alpha Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body style="font-family: sans-serif; padding: 20px;">
    <h2>Admin Dashboard - Manage Orders</h2>
    <div id="admin-list"></div>

    <script>
        function loadAdmin() {
            const orders = JSON.parse(localStorage.getItem("allOrders")) || [];
            const div = document.getElementById("admin-list");
            div.innerHTML = "";

            orders.forEach((order, index) => {
                div.innerHTML += `
                    <div style="border:1px solid #000; padding:10px; margin-bottom:10px;">
                        <p><b>Order ID:</b> ${order.id} | <b>Cust:</b> ${order.customer}</p>
                        <p><b>Status:</b> ${order.status}</p>
                        <button onclick="updateStatus(${index}, 'Confirmed')">Confirm</button>
                        <button onclick="updateStatus(${index}, 'Delivered')">Mark Delivered</button>
                        <button onclick="updateStatus(${index}, 'Cancelled')" style="color:red;">Cancel</button>
                    </div>
                `;
            });
        }

        function updateStatus(index, newStatus) {
            let orders = JSON.parse(localStorage.getItem("allOrders"));
            orders[index].status = newStatus;
            localStorage.setItem("allOrders", JSON.stringify(orders));
            alert("Status Updated!");
            loadAdmin();
        }
        loadAdmin();
    </script>
</body>
</html>
